name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pydantic-settings cryptography sympy langchain-community langchain-core
      - name: Run unit tests
        env:
          AUDIT_PHONE_SALT: ci-test-salt-min-16-chars
          PHONE_ENCRYPTION_KEY: ""
        run: python -m unittest discover -s tests -p "test_*.py" -v
