# Tema do painel DeepEdu (lido pelo streamlit ao rodar dentro de control_panel/).
[theme]
base = "light"
# Azul-escuro para botões, abas ativas e destaques (no lugar do vermelho padrão).
primaryColor = "#1F4E9E"
backgroundColor = "#FFFFFF"
# Barra lateral e campos de texto: azul-acinzentado mais escuro que o padrão (#F0F2F6).
secondaryBackgroundColor = "#D6DFEC"
textColor = "#1B1F24"
