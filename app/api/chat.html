<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepEdu</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe6;
      --paper: #fffcf8;
      --ink: #1c1915;
      --muted: #6b645c;
      --line: #e4ddd2;
      --student: #1f6feb;
      --tutor: #efeae2;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .app {
      height: 100%;
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
    header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--line);
    }
    .topo {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }
    header h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .nome-linha {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 4px 4px 4px 0;
      min-width: 11rem;
      max-width: 14rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    #nome {
      width: 100%;
      border: 3px solid #174ea6;
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    #nome:focus {
      border-color: #0f3d8c;
    }
    #mensagens {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .vazio {
      margin: auto;
      text-align: center;
      max-width: 26rem;
    }
    .vazio p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }
    .exemplo {
      margin-top: 12px;
      color: var(--ink);
      font-size: 1.05rem;
    }
    .bolha {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: 14px;
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 0.98rem;
    }
    .aluno {
      align-self: flex-end;
      background: var(--student);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .tutor {
      align-self: flex-start;
      background: var(--tutor);
      border-bottom-left-radius: 4px;
    }
    .erro { border: 1px solid #e7b3b3; background: #fff6f6; }
    form {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border-top: 1px solid var(--line);
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      border: 3px solid #174ea6;
      border-radius: 12px;
      padding: 10px 12px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      outline: none;
    }
    textarea:focus {
      border-color: #0f3d8c;
    }
    button {
      border: 3px solid #0f3d8c;
      border-radius: 12px;
      padding: 0 16px;
      background: var(--student);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    button:hover {
      background: #1858c7;
    }
    button:focus-visible {
      border-color: #0a2f6e;
    }
    button:disabled {
      opacity: 0.55;
      cursor: default;
    }
    @media (max-width: 640px) {
      .topo { flex-direction: column; align-items: stretch; }
      .nome-linha { max-width: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="topo">
        <div>
          <h1>DeepEdu</h1>
          <p>Tutor de matemática.</p>
        </div>
        <div class="nome-linha">
          <input id="nome" maxlength="80" placeholder="seu nome" aria-label="Seu nome" autocomplete="nickname">
        </div>
      </div>
    </header>
    <div id="mensagens">
      <div class="vazio" id="vazio">
        <p>Pergunte como se estivesse na aula.</p>
        <p class="exemplo">Qual a raiz de x² − 5x + 6 = 0?</p>
      </div>
    </div>
    <form id="form">
      <textarea id="texto" rows="2" placeholder="Escreva sua dúvida" required></textarea>
      <button type="submit" id="enviar">Enviar</button>
    </form>
  </div>
  <script>
    const lista = document.getElementById("mensagens");
    const vazio = document.getElementById("vazio");
    const form = document.getElementById("form");
    const texto = document.getElementById("texto");
    const enviar = document.getElementById("enviar");
    const nome = document.getElementById("nome");
    const guardado = localStorage.getItem("deepedu-nome");
    if (guardado && guardado !== "aluno-local") nome.value = guardado;
    nome.addEventListener("change", () => {
      const valor = nome.value.trim();
      if (valor) localStorage.setItem("deepedu-nome", valor);
      else localStorage.removeItem("deepedu-nome");
    });

    function bolha(classe, conteudo) {
      vazio.remove();
      const el = document.createElement("div");
      el.className = "bolha " + classe;
      el.textContent = conteudo;
      lista.appendChild(el);
      lista.scrollTop = lista.scrollHeight;
      return el;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = texto.value.trim();
      if (!question) return;
      texto.value = "";
      bolha("aluno", question);
      const espera = bolha("tutor", "Estou pensando…");
      enviar.disabled = true;
      try {
        const resp = await fetch("/perguntar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            student_id: nome.value.trim() || "aluno-local",
            question: question
          })
        });
        const data = await resp.json();
        if (!resp.ok) {
          espera.classList.add("erro");
          espera.textContent = "Não consegui responder agora. Tente de novo.";
          return;
        }
        espera.textContent = data.answer || "Não posso atender a esse pedido.";
      } catch (err) {
        espera.classList.add("erro");
        espera.textContent = "Não consegui falar com o tutor nesta máquina.";
      } finally {
        enviar.disabled = false;
        texto.focus();
      }
    });

    texto.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
